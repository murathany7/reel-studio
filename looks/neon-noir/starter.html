<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Look starter: neon noir</title>
<link rel="stylesheet" href="/core/lib/base.css">
<!-- <link rel="stylesheet" href="/brands/<slug>/tokens.css"> -->
<link rel="stylesheet" href="/looks/neon-noir/look.css">
<style>
  #rain { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card { position: absolute; left: 0; right: 0; }
  #c1 { top: 8%; } #c2 { top: 10%; } #c3 { top: 26%; text-align: center; }
  #c2 .nn-mono { display: block; margin-bottom: 22px; white-space: nowrap; overflow: hidden; }
  #scrim { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(6,5,11,.82) 0%, rgba(6,5,11,.55) 38%, transparent 62%); }
  .brand { font: 800 150px/1 var(--nn-font-display); letter-spacing: 0.04em; text-transform: uppercase; color: var(--nn-neon-a); }
</style>
<script type="importmap">{ "imports": { "three": "/core/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<div id="stage">
  <div class="layer" id="city"></div>
  <canvas id="rain"></canvas>
  <div id="scrim"></div>
  <div class="safe">
    <div class="nn-hud"><i></i><i></i><i></i><i></i></div>
    <div class="card" id="c1">
      <div class="nn-mono" id="m1">02:47 · sector 9</div>
      <div class="nn-title" id="t1">The city<br>never <span class="a">sleeps</span></div>
    </div>
    <div class="card" id="c2">
      <span class="nn-mono" id="l1">signal found</span>
      <span class="nn-mono" id="l2">route locked in 3 taps</span>
      <span class="nn-mono" id="l3">you're already there</span>
      <div class="nn-title" id="t2" style="margin-top:40px">Run<br><span class="b">the night</span></div>
    </div>
    <div class="card" id="c3">
      <div class="brand" id="brand">Brand</div>
      <div style="margin-top:36px"><span class="nn-tag">Get it tonight</span></div>
    </div>
  </div>
</div>

<script src="/core/node_modules/gsap/dist/gsap.min.js"></script>
<script src="/core/lib/runtime.js"></script>
<script src="/looks/fx.js"></script>
<script type="module">
  import { threeLayer, emissive, bloom } from "/engines/three.js";
  const tl = Studio.setup({ width: 1080, height: 1920, fps: 30, duration: 5 });
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const stage = document.getElementById("stage");

  // Three.js: a corridor of neon frames, camera pushing in, fog swallowing the far end. Bloom makes them glow.
  const { scene, camera, THREE } = threeLayer(document.getElementById("city"), {
    background: 0x06050b, post: bloom({ strength: 0.9, radius: 0.5, threshold: 0.2 }),
    update(t) { camera.position.set(Math.sin(t * 0.7) * 0.25, 0.2, 6 - t * 2.4); camera.rotation.z = Math.sin(t * 0.5) * 0.04; },
  });
  scene.fog = new THREE.Fog(0x06050b, 2, 20);
  const colA = new THREE.Color(css("--nn-neon-a")), colB = new THREE.Color(css("--nn-neon-b"));
  const rnd = Studio.random(9);
  for (let i = 0; i < 14; i++) {
    const z = -i * 2.2, mat = emissive(i % 3 ? colA : colB, 0.9 + rnd() * 0.8);
    const w = 3.2, h = 5.4, bar = 0.03;
    for (const [x, y, sx, sy] of [[0, h / 2, w, bar], [0, -h / 2, w, bar], [-w / 2, 0, bar, h], [w / 2, 0, bar, h]]) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, bar), mat);
      m.position.set(x, y, z); scene.add(m);
    }
    // Signs on the walls: short glowing bars at random heights.
    const sign = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.4 + rnd() * 1.2, 0.5), emissive(rnd() < .5 ? colA : colB, 1.4));
    sign.position.set(rnd() < .5 ? -1.5 : 1.5, -1 + rnd() * 3, z - 1.1); scene.add(sign);
  }

  // Rain: seeded streaks, each position from t (no state between frames).
  const rain = document.getElementById("rain"), ctx = rain.getContext("2d");
  rain.width = 1080; rain.height = 1920;
  const drops = Array.from({ length: 260 }, () => ({ x: rnd() * 1300 - 110, y: rnd() * 1920, v: 1800 + rnd() * 1400, l: 30 + rnd() * 70, a: 0.15 + rnd() * 0.35 }));
  Studio.onSeek((t) => {
    ctx.clearRect(0, 0, 1080, 1920);
    ctx.lineWidth = 2;
    for (const d of drops) {
      const y = (d.y + d.v * t) % 2000 - 40, x = d.x - y * 0.12;
      ctx.strokeStyle = `rgba(200,220,255,${d.a})`;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - d.l * 0.12, y + d.l); ctx.stroke();
    }
  });

  // Hard cuts on glitches: 0–1.6 hook, 1.6–3.3 the proof typed out, 3.3–5 end card.
  gsap.set(["#c2", "#c3"], { autoAlpha: 0 });
  tl.set("#c1", { autoAlpha: 0 }, 1.6).set("#c2", { autoAlpha: 1 }, 1.6)
    .set("#c2", { autoAlpha: 0 }, 3.3).set("#c3", { autoAlpha: 1 }, 3.3);
  tl.from("#t1", { autoAlpha: 0, duration: 0.01 }, 0.12).from("#m1", { clipPath: "inset(0 100% 0 0)", duration: 0.5, ease: "steps(16)" }, 0);
  ["#l1", "#l2", "#l3"].forEach((id, i) => tl.from(id, { clipPath: "inset(0 100% 0 0)", duration: 0.35, ease: "steps(20)" }, 1.65 + i * 0.32));
  tl.from("#t2", { autoAlpha: 0, duration: 0.01 }, 2.7);
  tl.from("#brand", { scale: 1.15, duration: 0.5, ease: "expo.out" }, 3.3);

  LookFx.neon(document.getElementById("brand"), { spread: 0.7 });
  for (const id of [".nn-title .a", ".nn-title .b"]) document.querySelectorAll(id).forEach((el) => LookFx.neon(el, { spread: 0.45 }));
  LookFx.flicker(document.getElementById("brand"), { rate: 3, from: 3.5 });
  LookFx.glitch(document.querySelector(".safe"), { at: [0.1, 1.55, 3.25], dur: 0.18 });
  LookFx.scanlines(stage, { gap: 5, opacity: 0.28, roll: 700 });
  LookFx.vignette(stage, { amount: 0.7 });
  LookFx.grain(stage, { amount: 0.05, fps: 30 });
</script>
</body>
</html>
