<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Look starter: paper collage</title>
<link rel="stylesheet" href="/core/lib/base.css">
<!-- <link rel="stylesheet" href="/brands/<slug>/tokens.css"> -->
<link rel="stylesheet" href="/looks/paper-collage/look.css">
<style>
  #sun { left: 520px; top: 980px; width: 460px; height: 460px; border-radius: 50%; }
  #hill1 { left: -120px; top: 1260px; width: 900px; height: 700px; border-radius: 50% 50% 0 0; }
  #hill2 { left: 380px; top: 1380px; width: 900px; height: 600px; border-radius: 55% 45% 0 0; }
  #note { left: 90px; top: 760px; width: 560px; height: 300px; transform: rotate(-4deg); padding: 50px 46px; }
  .card { position: absolute; left: 0; right: 0; }
  #c1, #c2 { top: 0; } #c3 { top: 4%; text-align: center; }
  #c3 .pc-letters { justify-content: center; }
  #c2 .pc-stamp { margin-top: 40px; transform: rotate(-8deg); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="pc-torn" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="4"/>
  <feDisplacementMap in="SourceGraphic" scale="14" xChannelSelector="R" yChannelSelector="G"/>
</filter></svg>
<div id="stage">
  <div class="pc-cut c" id="sun"></div>
  <div class="pc-cut b" id="hill2"></div>
  <div class="pc-cut a" id="hill1"></div>
  <div class="pc-cut" id="note"><div class="pc-hand">"I actually like<br>mornings now."</div></div>
  <div class="pc-tape" style="left:300px; top:735px; transform:rotate(6deg)" id="tape"></div>
  <div class="safe">
    <div class="card" id="c1"><div class="pc-letters" id="w1"><span>G</span><span>o</span><span>o</span><span>d</span></div>
      <div class="pc-letters" id="w2" style="margin-top:12px"><span>m</span><span>o</span><span>r</span><span>n</span><span>i</span><span>n</span><span>g</span></div></div>
    <div class="card" id="c2"><div class="pc-letters" id="w3"><span>3</span><span>t</span><span>a</span><span>p</span><span>s</span></div><div class="pc-stamp" id="stamp">That's it</div></div>
    <div class="card" id="c3"><div class="pc-letters" id="w4"><span>B</span><span>r</span><span>a</span><span>n</span><span>d</span></div><div class="pc-hand" style="margin-top:30px">made by hand, for you</div></div>
  </div>
</div>

<script src="/core/node_modules/gsap/dist/gsap.min.js"></script>
<script src="/core/lib/runtime.js"></script>
<script src="/looks/fx.js"></script>
<script>
  const tl = Studio.setup({ width: 1080, height: 1920, fps: 30, duration: 5 });
  // Stop motion: every move is in steps (12 drawings a second), and cut-outs "boil" a little on twos.
  const rnd = Studio.random(21); // seeded: every render gets the same tilts
  const step = (d) => `steps(${Math.max(2, Math.round(d * 12))})`;
  const pop = (sel, at, d = 0.4) => tl.from(sel, { scale: 0, rotation: () => Math.round((rnd() - 0.5) * 50), duration: d, ease: step(d), stagger: 1 / 12 }, at);
  tl.from("#hill1", { y: 700, duration: 0.5, ease: step(0.5) }, 0)
    .from("#hill2", { y: 700, duration: 0.5, ease: step(0.5) }, 0.08)
    .from("#sun", { y: 500, duration: 0.7, ease: step(0.7) }, 0.25);
  gsap.set(["#c2", "#c3"], { autoAlpha: 0 });
  pop("#w1 span", 0.1); pop("#w2 span", 0.45);
  tl.set("#c1", { autoAlpha: 0 }, 1.7).set("#c2", { autoAlpha: 1 }, 1.7);
  pop("#w3 span", 1.7);
  tl.from("#stamp", { scale: 2.2, autoAlpha: 0, duration: 0.25, ease: step(0.25) }, 2.3);
  tl.from(["#note", "#tape"], { x: -900, duration: 0.5, ease: step(0.5), stagger: 0.2 }, 2.5);
  tl.set("#c2", { autoAlpha: 0 }, 3.4).set("#c3", { autoAlpha: 1 }, 3.4);
  pop("#w4 span", 3.4);
  tl.to(["#note", "#tape"], { x: 900, duration: 0.4, ease: step(0.4) }, 3.4);

  // Each letter block sits a little crooked.
  document.querySelectorAll(".pc-letters span").forEach((s) => s.style.rotate = `${(rnd() - 0.5) * 10}deg`);
  LookFx.jitter([...document.querySelectorAll(".pc-cut, .pc-letters")], { px: 2, deg: 0.5, fps: 12 });
  LookFx.grain(document.getElementById("stage"), { amount: 0.06, blend: "multiply", fps: 12 });
</script>
</body>
</html>
