<!doctype html>
<html><head><meta charset="utf-8"><title>Bike Logger crew: cast sheet</title>
<link rel="stylesheet" href="/core/lib/base.css">
<link rel="stylesheet" href="/brands/bike-logger/tokens.css">
<style>
  #grid { position: absolute; left: 64px; right: 64px; top: 330px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px 40px; }
  .cell { text-align: center; }
  .cell svg { width: 360px; height: 360px; }
  .cell .eyebrow { font-size: 24px; margin-top: 4px; }
  .cell .name { font-size: 50px; margin-top: 6px; }
  .crew #mouth-open { opacity: 0; }
  #head { position: absolute; left: 64px; right: 64px; top: 120px; }
</style></head><body><div id="stage">
  <div id="head"><div class="eyebrow">Bike Logger · the crew</div><div class="display hook" style="font-size:96px;margin-top:16px">The crew. Grown up.</div></div>
  <div id="grid"></div>
</div>
<script src="/core/node_modules/gsap/dist/gsap.min.js"></script>
<script src="/core/lib/runtime.js"></script>
<script>window.STYLE = "adult";</script><script src="/brands/bike-logger/assets/cartoon/crew.js"></script>
<script>
  Studio.setup({ width: 1080, height: 1920, fps: 30, duration: 1 });
  const cast = [["pi", "Brain", "Raspberry Pi 5"], ["cam", "Cam", "Camera Module 3 Wide"], ["gps", "Fix", "USB GPS · u-blox"],
                ["imu", "Tilt", "BNO085 · 9-axis"], ["sonar", "Ping", "Ultrasonic · behind"], ["hall", "Spin", "A3144 Hall + magnet"]];
  document.getElementById("grid").innerHTML = cast.map(([k, n, p]) =>
    `<div class="cell">${Crew[k]({ style: window.STYLE || "fun" })}<div class="display name">${n}</div><div class="eyebrow">${p}</div></div>`).join("");
</script></body></html>
