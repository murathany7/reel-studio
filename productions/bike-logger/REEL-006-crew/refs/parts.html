<!doctype html>
<html><head><meta charset="utf-8"><title>Bike Logger parts sheet</title>
<link rel="stylesheet" href="/core/lib/base.css">
<link rel="stylesheet" href="/brands/bike-logger/tokens.css">
<style>
  #grid { position: absolute; left: 64px; right: 64px; top: 300px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px 40px; }
  .cell { text-align: center; } .cell svg { width: 380px; height: 380px; }
  .cell .eyebrow { font-size: 24px; margin-top: 2px; }
  #head { position: absolute; left: 64px; right: 64px; top: 110px; }
</style></head><body><div id="stage">
  <div id="head"><div class="eyebrow">Bike Logger · the parts</div><div class="display hook" style="font-size:96px;margin-top:16px">What's inside.</div></div>
  <div id="grid"></div>
</div>
<script src="/core/node_modules/gsap/dist/gsap.min.js"></script>
<script src="/core/lib/runtime.js"></script>
<script src="/brands/bike-logger/assets/cartoon/parts.js"></script>
<script>
  // ?style=adult for the adult drawing
  Studio.setup({ width: 1080, height: 1920, fps: 30, duration: 1 });
  const style = Studio.params.get("style") || "fun";
  document.getElementById("grid").innerHTML = Parts.ORDER.map((k) => `<div class="cell">${Parts[k]({ style })}<div class="eyebrow">${Parts.NAMES[k]}</div></div>`).join("");
</script></body></html>
