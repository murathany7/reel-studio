<!doctype html>
<html><head><meta charset="utf-8"><title>REEL-010 Five signals</title>
<link rel="stylesheet" href="/core/lib/base.css">
<link rel="stylesheet" href="/brands/bike-logger/tokens.css">
<link rel="stylesheet" href="/engines/ad-kit/ad-kit.css">
<link rel="stylesheet" href="/brands/bike-logger/assets/cartoon/theme.css">
</head><body><div id="stage"></div>
<script src="/core/node_modules/gsap/dist/gsap.min.js"></script>
<script src="/core/lib/runtime.js"></script>
<script src="/engines/svg-rig.js"></script>
<script src="/engines/ad-kit/ad-kit.js"></script>
<script src="/engines/ad-kit/scenes.js"></script>
<script src="/brands/bike-logger/assets/cartoon/parts.js"></script>
<script src="/brands/bike-logger/assets/cartoon/bike.js"></script>
<script src="/brands/bike-logger/assets/cartoon/brief.js"></script>
<script src="/brands/bike-logger/assets/cartoon/signals.js"></script>
<script>
  // REEL-010 Five signals. Variants: ?look=cartoon|blueprint|daylight &style=fun|adult &hook=A|B|C &size= &fps=
  const P = Studio.params, style = P.get("style") || "fun", hook = P.get("hook") || "A", A = style === "adult";
  const look = P.get("look") || "cartoon";
  const b = BL.brief(style), say = (f, a) => (A ? a : f);
  const hooks = {
    A: { eyebrow: "Robotics starter kit", title: say("Five sensors. One clock.", "Five sensors. One clock.") },
    B: { eyebrow: "Robotics starter kit", title: say("What your bike feels.", "Your ride, as data.") },
    C: { eyebrow: "Robotics starter kit", title: say("Every line is a sensor.", "Every line is a sensor.") },
  };
  const scenes = [
    { type: "signals", dur: 10, beats: [
        { at: -0.12, ...hooks[hook] },
        { at: 2.4, eyebrow: "Camera · GPS · IMU · ultrasonic · Hall", title: say("Each one writes its own line.", "Each writes its own line.") },
        { at: 4.8, eyebrow: "Code it", title: say("A pothole. A car. A tunnel.", "A pothole. A car. A tunnel.") },
        { at: 7.4, eyebrow: "One timeline", title: say("Same moment, every line.", "Same moment. Every line.") },
      ] },
    { type: "endcard", dur: 2.4, ...b.brand, actors: ["imu", "sonar", "hall"] },
  ];
  AdKit.build({ scenes, style, size: P.get("size") || "reel", cast: BL.lookCast(look), look, forbid: BL.forbid, motion: BL.motion, fps: +(P.get("fps") || 60) });
</script></body></html>
