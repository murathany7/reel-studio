<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>REEL-008 style frames: neon noir</title>
<!-- Direction style frames (not the composition): looks/neon-noir/starter.html with the Bike Logger tokens, the real
     hook and the real tray CAD as neon edges. Stills: t=1.0 (hook) and t=2.4 (a part beat). -->
<link rel="stylesheet" href="/core/lib/base.css">
<link rel="stylesheet" href="/brands/bike-logger/tokens.css">
<style>:root { --neon-b: var(--signal); --font-display-condensed: "Archivo"; }</style>
<link rel="stylesheet" href="/looks/neon-noir/look.css">
<style>
  .nn-title { font-variation-settings: "wdth" 62; font-weight: 900; }
  #rain { position: absolute; inset: 0; width: 100%; height: 100%; }
  #scrim { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(6,8,10,.85) 0%, rgba(6,8,10,.5) 36%, transparent 58%); }
  .card { position: absolute; left: 0; right: 0; top: 7%; }
  .nn-mono.rec::before { content: "● "; color: var(--brake); opacity: 1; }
  .spec { margin-top: 34px; display: flex; gap: 14px; flex-wrap: wrap; }
  .spec span { font: 500 30px/1 var(--nn-font-mono); letter-spacing: .06em; padding: 12px 16px; border: 2px solid var(--nn-neon-b); color: var(--nn-neon-b); background: rgba(6,8,10,.6); }
</style>
<script type="importmap">{ "imports": { "three": "/core/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<div id="stage">
  <div class="layer" id="scene"></div>
  <canvas id="rain"></canvas>
  <div id="scrim"></div>
  <div class="safe">
    <div class="nn-hud"><i></i><i></i><i></i><i></i></div>
    <div class="card" id="c1">
      <div class="nn-mono rec">02:47 · ride 01 · recording</div>
      <div class="nn-title" style="margin-top:20px">Wire five<br>sensors.<br><span class="a">Ride the night.</span></div>
    </div>
    <div class="card" id="c2">
      <div class="nn-mono">01 · brain · raspberry pi 5</div>
      <div class="nn-title" style="margin-top:20px">One Pi.<br><span class="a">One sealed box.</span></div>
      <div class="spec"><span>8 GB</span><span>IP65</span><span>200 × 120 × 75 mm</span></div>
    </div>
  </div>
</div>

<script src="/core/node_modules/gsap/dist/gsap.min.js"></script>
<script src="/core/lib/runtime.js"></script>
<script src="/looks/fx.js"></script>
<script type="module">
  import { threeLayer, emissive, bloom } from "/engines/three.js";
  const tl = Studio.setup({ width: 1080, height: 1920, fps: 30, duration: 3 });
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const lamp = css("--lamp"), signal = css("--signal");

  const { scene, camera, THREE } = threeLayer(document.getElementById("scene"), {
    background: 0x06080a, post: bloom({ strength: 0.9, radius: 0.5, threshold: 0.2 }),
    update(t) {
      const close = t >= 1.5;
      corridor.visible = !close; tray.visible = close;
      if (!close) { camera.position.set(Math.sin(t * 0.7) * 0.25, 0.2, 6 - t * 2.4); camera.lookAt(0, 0.2, -20); }
      else {
        const a = -0.9 + (t - 1.5) * 0.35;
        camera.position.set(Math.sin(a) * 6.4, 2.8, Math.cos(a) * 6.4); camera.lookAt(0, -1.1, 0);
      }
    },
  });
  scene.fog = new THREE.Fog(0x06080a, 2, 20);

  // Corridor of neon frames: lamp and signal, the brand's two light colours.
  const corridor = new THREE.Group(); scene.add(corridor);
  const rnd = Studio.random(9);
  for (let i = 0; i < 14; i++) {
    const z = -i * 2.2, mat = emissive(new THREE.Color(i % 3 ? lamp : signal), 0.9 + rnd() * 0.8);
    for (const [x, y, sx, sy] of [[0, 2.7, 3.2, .03], [0, -2.7, 3.2, .03], [-1.6, 0, .03, 5.4], [1.6, 0, .03, 5.4]]) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, .03), mat); m.position.set(x, y, z); corridor.add(m);
    }
  }

  // The real tray CAD: dark solid faces, every crease drawn as a glowing edge (signal), the Pi in lamp.
  const cad = await Studio.wait(fetch("/brands/bike-logger/assets/models/tray.json").then((r) => r.json()));
  const tray = new THREE.Group(), inner = new THREE.Group();
  inner.rotation.x = -Math.PI / 2; inner.scale.setScalar(0.01); tray.add(inner); scene.add(tray);
  const dark = new THREE.MeshBasicMaterial({ color: 0x0b0e12, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  for (const c of cad.components) {
    if (c.kind === "ghost") continue;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(c.v, 3)); geo.setIndex(c.t);
    const hot = /^pi/.test(c.id);
    inner.add(new THREE.Mesh(geo, dark));
    inner.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), new THREE.LineBasicMaterial({ color: new THREE.Color(hot ? lamp : signal).multiplyScalar(hot ? 1.6 : 1.1) })));
  }
  tray.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(tray);
  inner.position.copy(box.getCenter(new THREE.Vector3()).multiplyScalar(-1));
  tray.scale.setScalar(3.4 / box.getSize(new THREE.Vector3()).length());
  tray.position.y = -1.6;

  const rain = document.getElementById("rain"), ctx = rain.getContext("2d");
  rain.width = 1080; rain.height = 1920;
  const drops = Array.from({ length: 240 }, () => ({ x: rnd() * 1300 - 110, y: rnd() * 1920, v: 1800 + rnd() * 1400, l: 30 + rnd() * 70, a: .12 + rnd() * .3 }));
  Studio.onSeek((t) => {
    ctx.clearRect(0, 0, 1080, 1920); ctx.lineWidth = 2;
    for (const d of drops) { const y = (d.y + d.v * t) % 2000 - 40, x = d.x - y * .12; ctx.strokeStyle = `rgba(200,225,255,${d.a})`; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - d.l * .12, y + d.l); ctx.stroke(); }
  });

  Studio.swap("#c1", "#c2", 1.5);
  document.querySelectorAll(".nn-title .a").forEach((el) => LookFx.neon(el, { spread: .22 }));
  LookFx.glitch(document.querySelector(".safe"), { at: [1.45], dur: .18 });
  const stage = document.getElementById("stage");
  LookFx.scanlines(stage, { gap: 5, opacity: .26, roll: 700 });
  LookFx.vignette(stage, { amount: .7 });
  LookFx.grain(stage, { amount: .05, fps: 30 });
</script>
</body>
</html>
