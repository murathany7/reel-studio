name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 6 * * 1"  # Mondays: the macOS run

permissions:
  contents: read

# PRs: a new push cancels the stale run. main: every commit gets its own run. github.workflow is the caller's name
# when Release calls this file, so the release's test run never cancels (or waits on) the push run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PRs, pushes and releases test on Linux only. GitHub's macOS runners can queue 15+ minutes and then drop the
        # job ("not acquired by Runner", capacity), which turned whole runs red with nothing wrong in the code.
        # macOS runs weekly and when started by hand (Actions → CI → Run workflow), never in Release's call.
        include: ${{ fromJSON(github.workflow == 'CI' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[{"os":"ubuntu-latest","node":20},{"os":"ubuntu-latest","node":24},{"os":"macos-latest","node":24}]' || '[{"os":"ubuntu-latest","node":20},{"os":"ubuntu-latest","node":24}]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Keep test renders in the runner's temp dir (uploaded if a test fails)
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: core/package-lock.json

      - uses: astral-sh/setup-uv@v7

      - name: Install ffmpeg
        # The runner image ships third-party apt sources (packages.microsoft.com…) that sometimes 403 or lose their
        # signature, failing `apt-get update` for everyone. Only Ubuntu's own archive is needed, so an update error
        # is a warning; the install itself retries and still fails the job if ffmpeg can't be installed.
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq || echo "::warning::apt-get update had errors (third-party source); installing from the Ubuntu archive"
            for i in 1 2 3; do sudo apt-get install -y -qq ffmpeg rsync && break; [ $i = 3 ] && exit 1; sleep 15; done
          else
            for i in 1 2 3; do brew install ffmpeg && break; [ $i = 3 ] && exit 1; sleep 15; done
          fi
          ffmpeg -version | head -1

      - name: Check Chrome
        run: |
          for c in "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" /usr/bin/google-chrome; do
            [ -x "$c" ] && { "$c" --version; echo "CHROME_PATH=$c" >> "$GITHUB_ENV"; exit 0; }
          done
          echo "::error::Google Chrome not found on the runner"; exit 1

      - name: Install the renderer
        run: npm ci --prefix core --no-audit --no-fund

      - name: Tests (syntax, manifests, npm package, init, render determinism, video QA)
        run: npm test

      - name: Python package tests
        run: npm run test:python

      - name: Upload renders on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/rs-test-*
          if-no-files-found: ignore

  formula:
    name: Homebrew formula style
    # Linux: style and audit are the same there, and Linux runners don't queue like macOS ones
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: brew style and audit, from a local tap like a real formula
        env: { HOMEBREW_NO_AUTO_UPDATE: 1 }
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap-new --no-git local/ci
          cp packaging/homebrew/reel-studio.rb "$(brew --repository local/ci)/Formula/"
          brew trust local/ci  # Homebrew 7 only loads formulae from trusted taps
          brew style local/ci/reel-studio
          brew audit --strict --online --formula local/ci/reel-studio
