# One automatic retry for CI and Release. GitHub's runners fail now and then for reasons outside this repo (a macOS
# runner never assigned, an apt mirror returning 403), and a second attempt clears them. Only the failed jobs rerun,
# and only once: a real failure fails again and stays red. Release jobs are safe to rerun (each target is skipped
# when it already has the version).
name: Rerun failed once

on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          NAME: ${{ github.event.workflow_run.name }}
        run: |
          echo "::notice::$NAME run $RUN failed on its first attempt; rerunning its failed jobs once"
          gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"
